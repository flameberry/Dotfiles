set -g @tmux-dotbar-position top

# Rosé Pine theme
set -g @tmux-dotbar-bg "#0b0a10"
set -g @tmux-dotbar-fg "#6e6a86"
set -g @tmux-dotbar-fg-current "#e0def4"
set -g @tmux-dotbar-fg-session "#908caa"
set -g @tmux-dotbar-fg-prefix "#eb6f92"

# Window/tab labels: index and name
# e.g. "1:nvim"
set -g @tmux-dotbar-window-status-format " #I:#W "
