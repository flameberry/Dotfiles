# Starship port of the fish "arrow" prompt (fish/functions/fish_prompt.fish)
#
#   ➜  config git:(dev) ✗
#
#   arrow      bold green, bold red on non-zero exit status
#   cwd        bold cyan, basename only
#   git:(...)  bold blue parens, bold red branch (or short sha when detached)
#   ✗          bold yellow, shown when the repo has staged or unstaged changes

format = "$character  $directory$git_branch$git_commit$hg_branch${custom.git_dirty} "

add_newline = false

# ➜ — green on success, red on failure. The fish prompt swaps this for "#"
# when running as root; starship has no per-user character, so it stays ➜.
[character]
format = "$symbol"
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

# prompt_pwd | path basename — only the final path component
[directory]
style = "bold cyan"
truncation_length = 1
truncation_symbol = ""
truncate_to_repo = false
read_only = ""
read_only_style = ""
format = "[$path]($style)"

[git_branch]
format = '[ git:\(](bold blue)[$branch](bold red)[\)](bold blue)'
only_attached = true

# Detached HEAD falls back to the short sha, like _git_branch_name does
[git_commit]
only_detached = true
tag_disabled = true
format = '[ git:\(](bold blue)[$hash](bold red)[\)](bold blue)'

[hg_branch]
disabled = false
format = '[ hg:\(](bold blue)[$branch](bold red)[\)](bold blue)'
truncation_symbol = ""

# _is_git_dirty: staged changes against HEAD, or unstaged changes in the
# worktree. Untracked files do not count as dirty.
[custom.git_dirty]
description = "✗ when the repo has staged or unstaged changes"
when = "! git diff-index --cached --quiet HEAD -- >/dev/null 2>&1 || ! git diff --no-ext-diff --quiet --exit-code >/dev/null 2>&1"
command = "echo ✗"
require_repo = true
shell = ["sh"]
format = "[ $output](bold yellow)"

# Everything else the arrow prompt does not show
[git_status]
disabled = true

[cmd_duration]
disabled = true
